name: Add an AI intelligence source
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  register:
    if: ${{ startsWith(github.event.issue.title, '[Add Source]') && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: Read request and register source
        env:
          ISSUE_JSON: ${{ toJSON(github.event) }}
        run: |
          printf '%s' "$ISSUE_JSON" > /tmp/source-issue.json
          python -m src.add_source --issue-file /tmp/source-issue.json
      - name: Commit updated sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extra_sources.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: add user-submitted AI source"
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin HEAD:"${{ github.event.repository.default_branch }}"
          fi
      - name: Confirm in GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body 'Source request processed. The URL was added to `extra_sources.yaml` (or was already present). It will be checked at the next daily digest run.'
          gh issue close "$ISSUE_NUMBER"
