name: Daily AI Intelligence Digest
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-ai-digest
  cancel-in-progress: false
jobs:
  digest:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install optional local LLM backend
        if: ${{ vars.USE_LOCAL_LLM != '0' }}
        run: |
          pip install llama-cpp-python==0.3.16 || echo 'WARNING: Local LLM install failed; digest will use extractive fallback'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Create daily digest and send email
        env:
          GH_API_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          USE_LOCAL_LLM: ${{ vars.USE_LOCAL_LLM || '1' }}
          HF_GGUF_REPO: ${{ vars.HF_GGUF_REPO || 'bartowski/Qwen2.5-0.5B-Instruct-GGUF' }}
          HF_GGUF_FILE: ${{ vars.HF_GGUF_FILE || 'Qwen2.5-0.5B-Instruct-Q4_K_M.gguf' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          MAX_STORIES: '60'
          LOOKBACK_HOURS: '36'
          MAX_PER_CATEGORY: '8'
          ENABLE_ARXIV_SEARCH: '1'
          FETCH_FULL_TEXT: '0'
        run: python -m src.pipeline
      - name: Commit digest and database back to repository
        if: always()
        run: |
          if [ -f digest/latest.md ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md digest/latest.md digest/source-health.md docs/index.html docs/latest.md docs/source-health.md data/findings.sqlite
            if ! git diff --cached --quiet; then
              git commit -m 'chore: update daily AI digest'
              git push
            fi
          fi
      - name: Configure Pages
        if: success()
        uses: actions/configure-pages@v5
      - name: Upload digest website
        if: success()
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy digest website
        id: deployment
        if: success()
        uses: actions/deploy-pages@v4
